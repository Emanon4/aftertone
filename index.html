<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#0b0709"/>
  <script>
    (()=>{
      let theme="dark";
      try{if(localStorage.getItem("aftertone-theme")==="light")theme="light";}catch{}
      document.documentElement.dataset.theme=theme;
      document.querySelector('meta[name="theme-color"]').content=theme==="dark"?"#0b0709":"#fff4f7";
    })();
  </script>
  <style>:root{background:#0b0709;color-scheme:dark}:root[data-theme="light"]{background:#fff4f7;color-scheme:light}</style>
  <title>余音 Aftertone — 下一首，你的单曲循环。</title>
