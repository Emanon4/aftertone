version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Build and CI run Node 22; newer runtime APIs must not pass type checking.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Put coupled packages before the general group: the first match wins.
      eslint-toolchain:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "eslint-plugin-*"]
      cloudflare-toolchain:
        patterns: ["wrangler", "@cloudflare/workers-types"]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
